[project]
name = "haxdrill"
version = "0.1.0"
description = "HaxBall (Classic map) world model: keyboard action -> ball/opponent state"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "pygame>=2.5",
  "opencv-python-headless>=4.9",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haxdrill*"]
